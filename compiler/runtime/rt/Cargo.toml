[package]
name = "sakura_rt"
description = "The Sakura Lang WASM runtime (ABI.md next to this file): allocator, objects, collections, trampoline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `native`: the std runtime with the context-first C exports (ABI §1b). Cargo cannot feature-gate
# `crate-type`; the staticlib is `cargo rustc --crate-type staticlib -- -Cpanic=abort`
# (`crates/sakura_host_native/tests/smoke.rs`).
[features]
default = []
# The crypto crates are native-only: the wasm32 object is built by `rustc` with no dependencies
# (`sakura_codegen_wasm/build.rs`), so `std/crypto` on WASM is the host's (RFC 0002 §7).
native = ["dep:libc", "dep:sha2", "dep:hmac", "dep:hkdf", "dep:pbkdf2"]
# Allocator annotations for the sanitizer lanes (design §17.173 (2), (3); `mem.rs`): `asan`
# links only under `-Zsanitizer=address`, `valgrind` reports only under Memcheck.
asan = ["native"]
valgrind = ["native", "dep:crabgrind"]

[dependencies]
crabgrind = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }

[dev-dependencies]
wasmparser.workspace = true
insta.workspace = true

# Not `workspace = true`: the workspace forbids `unsafe_code`, and the WASM backend of the linear
# memory (src/mem.rs) and the exports (src/wasm.rs) need it. Every block carries a `// SAFETY:`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
