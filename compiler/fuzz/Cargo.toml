[package]
name = "sakura-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Kept separate from the stable compiler workspace and its lockfile/CI gates.
[workspace]
members = ["."]

# `exec_native` (plan M5 row S): the native backend, kept out of every other target's build.
[features]
native = ["dep:sakura_codegen_native", "sakura_codegen_native/native"]

[dependencies]
libfuzzer-sys = "=0.4.13"
sakura_syntax = { path = "../crates/sakura_syntax" }
sakura_analysis = { path = "../crates/sakura_analysis" }
sakura_fmt = { path = "../crates/sakura_fmt" }
sakura_types = { path = "../crates/sakura_types" }
sakura_hir = { path = "../crates/sakura_hir" }
sakura_lir = { path = "../crates/sakura_lir" }
sakura_codegen_wasm = { path = "../crates/sakura_codegen_wasm" }
sakura_verify = { path = "../crates/sakura_verify" }
sakura_core = { path = "../crates/sakura_core" }
sakura_eval = { path = "../tools/sakura_eval" }
sakura_codegen_native = { path = "../crates/sakura_codegen_native", optional = true }
serde_json = "1.0.154"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmt_idempotent"
path = "fuzz_targets/fmt_idempotent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "row_unify"
path = "fuzz_targets/row_unify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lir"
path = "fuzz_targets/lir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vc"
path = "fuzz_targets/vc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec"
path = "fuzz_targets/exec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec_native"
path = "fuzz_targets/exec_native.rs"
required-features = ["native"]
test = false
doc = false
bench = false
