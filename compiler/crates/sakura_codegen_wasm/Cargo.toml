[package]
name = "sakura_codegen_wasm"
description = "The WASM backend: LIR to a module linked with the sakura_rt runtime (runtime/rt/ABI.md v1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sakura_lir.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true

# Not linked: the build script compiles `runtime/rt` with `miniz_oxide` and `adler2` for wasm32
# from their sources, and this edge makes every build of this crate download them.
[build-dependencies]
miniz_oxide.workspace = true

[dev-dependencies]
sakura_analysis.workspace = true
sakura_eval.workspace = true

[lints]
workspace = true
