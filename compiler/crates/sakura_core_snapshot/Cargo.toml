[package]
name = "sakura_core_snapshot"
description = "sakura-core-snapshot-v1: the committed, lossless copy of Core that M4 crates read before the M3 gates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The converter from live Core.
convert = ["dep:sakura_core"]
# `convert::snapshot`/`bless_dir` over the real frontend, for `SAKURA_BLESS=1` tests (enable it
# only as a dev-dependency).
bless = ["convert", "dep:sakura_analysis"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_stacker.workspace = true
sakura_hir.workspace = true
sakura_analysis = { workspace = true, optional = true }
sakura_core = { workspace = true, optional = true }

[lints]
workspace = true
