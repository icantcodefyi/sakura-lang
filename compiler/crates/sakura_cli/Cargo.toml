[package]
name = "sakura_cli"
description = "The `sakura` command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sakura"
path = "src/main.rs"

[features]
default = []
native = ["dep:sakura_codegen_native", "sakura_codegen_native/native", "dep:sakura_host_native", "sakura_host_native/native"]

[dependencies]
sakura_codegen_native = { workspace = true, optional = true }
sakura_host_native = { workspace = true, optional = true }
sakura_analysis.workspace = true
sakura_codegen_js.workspace = true
sakura_core.workspace = true
sakura_core_snapshot = { path = "../sakura_core_snapshot", features = ["convert"] }
sakura_eval.workspace = true
sakura_verify = { path = "../sakura_verify" }
sakura_hir.workspace = true
sakura_types.workspace = true
sakura_diagnostics.workspace = true
sakura_lir.workspace = true
sakura_codegen_wasm.workspace = true
sakura_lsp.workspace = true
sakura_mcp.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
agent_docs = { path = "../../tools/agent_docs" }
sha2.workspace = true

[lints]
workspace = true
