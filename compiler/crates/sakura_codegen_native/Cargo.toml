[package]
name = "sakura_codegen_native"
description = "The Cranelift backend: LIR to native objects for the offset32-v1 profile (ABI §1b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:sakura_lir", "dep:sakura_rt", "sakura_rt/native", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-object", "dep:cranelift-native", "dep:target-lexicon", "dep:gimli", "dep:object", "dep:find-msvc-tools"]

[dependencies]
sakura_lir = { workspace = true, optional = true }
sakura_rt = { workspace = true, optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
target-lexicon = { workspace = true, optional = true }
gimli = { workspace = true, optional = true }
object = { workspace = true, optional = true }

# `link.exe` from the Visual Studio installation (plan m5-native.md row C).
[target.'cfg(windows)'.dependencies]
find-msvc-tools = { workspace = true, optional = true }

[[test]]
name = "smoke"
required-features = ["native"]


[lints]
workspace = true
