[package]
name = "sakura_host_native"
description = "The native host: root handlers, Env and Fs for the native runtime (ABI §1b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
native = ["sakura_rt/native", "dep:sakura_rt", "dep:tokio", "dep:reqwest", "dep:rustls", "dep:rusqlite", "dep:hyper", "dep:cap-std", "dep:serde_json", "sakura_codegen_native/native"]

[dependencies]
sakura_rt = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
sakura_lir.workspace = true
# The corpus test compiles each program with N2 and compares it with the evaluator.
sakura_codegen_native.workspace = true
# The unwind test reads the emitted object's `.eh_frame` relocations.
object.workspace = true

[[test]]
name = "smoke"
required-features = ["native"]

[[test]]
name = "corpus"
required-features = ["native"]

[lints]
workspace = true
