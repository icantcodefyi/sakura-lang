[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "runtime/rt"]
# Keep the N0a native skeletons opt-in for plain `cargo build` / `cargo test`.
default-members = [
    "crates/sakura_analysis",
    "crates/sakura_cli",
    "crates/sakura_codegen_js",
    "crates/sakura_codegen_wasm",
    "crates/sakura_core",
    "crates/sakura_core_snapshot",
    "crates/sakura_diagnostics",
    "crates/sakura_fmt",
    "crates/sakura_hir",
    "crates/sakura_lir",
    "crates/sakura_lsp",
    "crates/sakura_mcp",
    "crates/sakura_syntax",
    "crates/sakura_types",
    "crates/sakura_verify",
    "runtime/rt",
    "tools/agent_docs",
    "tools/sakura_eval",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/icantcodefyi/sakuralang"
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction (docs/design.md §14.1):
# sakura_cli → sakura_analysis → {sakura_codegen_js, sakura_core, sakura_types, sakura_hir, sakura_syntax, sakura_fmt} → sakura_diagnostics
sakura_syntax = { path = "crates/sakura_syntax" }
sakura_diagnostics = { path = "crates/sakura_diagnostics" }
sakura_hir = { path = "crates/sakura_hir" }
sakura_types = { path = "crates/sakura_types" }
sakura_core = { path = "crates/sakura_core" }
sakura_codegen_js = { path = "crates/sakura_codegen_js" }
sakura_analysis = { path = "crates/sakura_analysis" }
sakura_fmt = { path = "crates/sakura_fmt" }
sakura_eval = { path = "tools/sakura_eval" }
sakura_lir = { path = "crates/sakura_lir" }
sakura_mcp = { path = "crates/sakura_mcp" }
sakura_lsp = { path = "crates/sakura_lsp" }
sakura_codegen_wasm = { path = "crates/sakura_codegen_wasm" }

sakura_codegen_native = { path = "crates/sakura_codegen_native" }
sakura_host_native = { path = "crates/sakura_host_native" }
sakura_rt = { path = "runtime/rt" }

# External crates. Add new ones here and use `dep.workspace = true` in crates.
rowan = "0.16.1"
text-size = "1.1.1"
la-arena = "0.3.1"
codespan-reporting = "0.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_stacker = "0.1.14"
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
pretty = "0.12.5"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
stacker = "0.1.25"
toml = "1.1.8"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
wasmparser = { version = "0.262.0", default-features = false, features = ["std", "validate", "features"] }
wasm-encoder = { version = "0.262.0", default-features = false, features = ["std", "wasmparser"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# Native toolchain, qualified together (design §17.175).
cranelift-codegen = "=0.136.3"
cranelift-frontend = "=0.136.3"
cranelift-module = "=0.136.3"
cranelift-object = "=0.136.3"
cranelift-native = "=0.136.3"
target-lexicon = "=0.13.5"
gimli = "=0.34.0"
object = "=0.40.0"
cap-std = "=4.0.3"
crabgrind = "=0.4.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1", "http2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info dominates target/ size. Keep line tables (backtraces) for our crates, none for deps.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.insta]
opt-level = 3
