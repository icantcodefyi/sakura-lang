[package]
name = "bench-web"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "main"
path = "main.rs"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros"] }

[profile.release]
overflow-checks = false
