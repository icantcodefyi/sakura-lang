family = "AWFY micro: backtracking over arrays"
suite = "are-we-fast-yet"
# Are We Fast Yet's Queens: run(n) runs benchmark() n times and sums the results (true = 1).
# AWFY's rebench size (inner_iterations) is a timed size.
sizes = [10, 100, 1000, 8000]
lane = "matched"
ints = "js-safe"
awfy = { benchmark = "Queens", inner_iterations = 1000, source = "smarr/are-we-fast-yet@74306fec benchmarks/JavaScript/queens.js" }

[verify]  # AWFY's verifyResult
"1" = "1"

[checksums]  # run(n), recorded by `bench oracle --write`
"0" = "0"
"1" = "1"
"2" = "2"
"3" = "3"
"10" = "10"
"100" = "100"
"1000" = "1000"
"8000" = "8000"
