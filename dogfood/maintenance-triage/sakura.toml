[package]
name = "maintenance_triage"
version = "0.1.0"
edition = "2026"

# Root authority `main` gets; everything absent is denied (design §6.2).
# Reads only under ./data, the provider host only, and only the API key.
[permissions]
fs.read = ["./data"]
net = ["api.anthropic.com:443"]
env = ["ANTHROPIC_API_KEY"]
