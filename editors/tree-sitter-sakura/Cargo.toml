[package]
name = "tree-sitter-sakura"
description = "Sakura Lang grammar for tree-sitter"
version = "0.1.0-alpha.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/icantcodefyi/sakuralang"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "sakura"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition = "2024"
rust-version = "1.99"
# Publication is the owner's (docs/release.md); nothing here is published yet.
publish = false
autoexamples = false
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.8.0"

[dev-dependencies]
tree-sitter = "0.27.1"
# The compiler's parser is the reference the repository test compares against.
sakura_syntax = { path = "../../compiler/crates/sakura_syntax" }
