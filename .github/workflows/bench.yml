name: Benchmarks

on:
  pull_request:
    paths:
      - "compiler/**"
      - "bench/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Full nightly suite, the native comparison alone (matched lane), the community suites alone (Benchmarks Game, Are We Fast Yet, web), or an unchanged-commit noise sample
        type: choice
        options: [nightly, native, suites, noise]
        default: nightly
      repeats:
        description: Independent quick noise runs per runner/engine (2–10)
        type: number
        default: 5
  schedule:
    - cron: "17 2 * * *" # nightly
    - cron: "43 3 * * 1" # weekly noise, five repeats (design §17.153 item 2)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    if: github.event_name == 'pull_request'
    name: Perf (${{ matrix.os }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: node
          - os: macos-latest
            engine: node
          - os: macos-latest
            engine: bun
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
          echo "$GITHUB_WORKSPACE/bench" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.engine == 'bun'
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
      - name: Measure and compare matched ratios
        env:
          BENCH_ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p bench-results
          python3 - <<'PY'
          import copy, json, os, pathlib, subprocess

          output = pathlib.Path("bench-results")
          engine = os.environ["BENCH_ENGINE"]

          def command(*args, allowed=(0,)):
              result = subprocess.run(["bench", *map(str, args)], check=False)
              if result.returncode not in allowed:
                  raise SystemExit(result.returncode)
              return result.returncode

          def measure(path, program=None):
              # The community suites have no blessed baseline; the `suites` job times them.
              args = ["run", "--suite", "js", "--engine", engine, "--exclude", "bg_*", "--exclude", "awfy_*",
                      "--lane", "matched", "--sizes", "quick", "--processes", "5", "--json", path]
              if program is not None:
                  args += ["--filter", program]
              # Missing optional toolchains are recorded by the harness on PRs.
              if command(*args, allowed=(0, 3)) == 3:
                  print("::warning::A toolchain was missing; see the result JSON")

          head_path = output / f"head-{engine}.json"
          measure(head_path)
          head = json.loads(head_path.read_text())
          candidates = [(p, json.loads(p.read_text()))
                        for p in sorted(pathlib.Path("bench/baselines").glob("*.json"))]

          def os_family(host):
              name = host["os"].lower()
              if "darwin" in name or "macos" in name:
                  return "macos"
              if "linux" in name:
                  return "linux"
              return name.split()[0]

          host = head["meta"]["host"]
          exact = [item for item in candidates if item[1]["meta"]["host"]["id"] == host["id"]]
          same_os = [item for item in candidates
                     if os_family(item[1]["meta"]["host"]) == os_family(host)]
          reference = [item for item in candidates
                       if "m4 pro" in item[1]["meta"]["host"]["cpu"].lower()]
          choices = exact or same_os or reference
          if not choices:
              print("::warning::No blessed baseline exists; oracle results are uploaded")
              raise SystemExit(0)
          base_path, base = max(choices, key=lambda item: item[1]["meta"]["started"])
          print(f"Comparing ratios against {base_path}")

          # Checksum, stack, complexity and malformed RSS data still fail immediately.
          # Node RSS crossings need the same one-time confirmation as timing (§17.136).
          command("compare", base_path, head_path, "--block", "1e300",
                  "--json", output / f"immediate-{engine}.json")
          code = command("compare", base_path, head_path, "--json",
                         output / f"compare-{engine}.json", allowed=(0, 2))
          comparison = json.loads((output / f"compare-{engine}.json").read_text())
          for row in comparison["rows"]:
              if row["status"] in ("flagged", "blocked"):
                  print(f"::warning::{row['program']} on {row['engine']} at n={row['size']}: ratio changed {row['delta']:+.1%}")
              elif row["status"].startswith("improved"):
                  print(f"::notice::{row['program']} improved by more than 10%; explain the improvement in the PR")
          def annotate_rss(report):
              for row in report["rss"]:
                  if row["status"] in ("flagged", "blocked"):
                      print(f"::warning::{row['program']} {row['variant']}/{row['engine']} n={row['size']}: "
                            f"peak RSS base={row['base_bytes']}, head={row['head_bytes']}, "
                            f"confirmation={row['confirmation_bytes']} bytes; "
                            f"medians base={row['base_median_bytes']}, head={row['head_median_bytes']}, "
                            f"confirmation={row['confirmation_median_bytes']}; "
                            f"counts base={row['base_processes']}, head={row['head_processes']}, "
                            f"confirmation={row['confirmation_processes']}; {row['note']}")

          annotate_rss(comparison)
          if not comparison["confirmation_programs"]:
              raise SystemExit(code)

          # Confirm the same program, so an unrelated regression in a second full run
          # cannot confirm a noisy first measurement. Preserve both sets of samples.
          blocked = False
          for index, program in enumerate(comparison["confirmation_programs"]):
              paths = []
              for label, data in (("base", base), ("head", head)):
                  subset = copy.deepcopy(data)
                  subset["results"] = [row for row in data["results"] if row["program"] == program]
                  path = output / f"{label}-{engine}-{index}.json"
                  path.write_text(json.dumps(subset))
                  paths.append(path)
              confirmation = output / f"confirm-{engine}-{index}.json"
              measure(confirmation, program)
              if command("compare", paths[0], paths[1], confirmation, "--json",
                         output / f"confirmed-{engine}-{index}.json", allowed=(0, 2)) == 2:
                  blocked = True
              annotate_rss(json.loads((output / f"confirmed-{engine}-{index}.json").read_text()))
          raise SystemExit(2 if blocked else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-pr-${{ matrix.os }}-${{ matrix.engine }}
          path: bench-results/
          if-no-files-found: warn

  nightly:
    if: github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    name: Nightly JS (${{ matrix.lane }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        lane: [matched, idiomatic]
        engine: [node, bun]
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
          echo "$GITHUB_WORKSPACE/bench" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.engine == 'bun'
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
      - name: Full JS suite
        env:
          BENCH_LANE: ${{ matrix.lane }}
          BENCH_ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p bench-results
          bench run --suite js --engine "$BENCH_ENGINE" --lane "$BENCH_LANE" --sizes all \
            --exclude 'bg_*' --exclude 'awfy_*' --stable --json "bench-results/nightly-${BENCH_LANE}-${BENCH_ENGINE}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-nightly-macos-${{ matrix.lane }}-${{ matrix.engine }}
          path: bench-results/
          if-no-files-found: warn

  nightly-native:
    # Wall time of Sakura --target native beside C, Rust, Go, OCaml and Koka on a hosted runner:
    # the time numbers anyone can reproduce (the counted baseline is the reference Mac's).
    if: github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'noise')
    name: Nightly native (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.mode == 'native' && '["matched"]' || '["matched", "idiomatic"]') }}
    runs-on: macos-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
          echo "$GITHUB_WORKSPACE/bench" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ steps.pins.outputs.ocaml }}
      - name: Expose OCaml native compiler
        run: |
          eval "$(opam env)"
          opam var bin >> "$GITHUB_PATH"
          test "$(ocamlopt -version)" = "${{ steps.pins.outputs.ocaml }}"
      - name: Install pinned Koka
        env:
          KOKA_VERSION: ${{ steps.pins.outputs.koka }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/koka-lang/koka/releases/download/v${KOKA_VERSION}/install.sh" \
            --output "$RUNNER_TEMP/install-koka.sh"
          sh "$RUNNER_TEMP/install-koka.sh" --minimal --force --prefix="$RUNNER_TEMP/koka"
          echo "$RUNNER_TEMP/koka/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Hyperfine
        id: hyperfine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/hyperfine
          key: hyperfine-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.hyperfine }}
      - name: Install pinned Hyperfine
        if: steps.hyperfine.outputs.cache-hit != 'true'
        env:
          HYPERFINE_VERSION: ${{ steps.pins.outputs.hyperfine }}
        run: cargo install hyperfine --version "=$HYPERFINE_VERSION" --locked
      - name: Full native suite
        env:
          BENCH_LANE: ${{ matrix.lane }}
        run: |
          mkdir -p bench-results
          cc --version
          bench run --suite native --lane "$BENCH_LANE" --sizes all \
            --exclude 'bg_*' --exclude 'awfy_*' --stable --json "bench-results/nightly-${BENCH_LANE}-native.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-nightly-native-macos-${{ matrix.lane }}
          path: bench-results/
          if-no-files-found: warn

  nightly-wasm:
    # The WASM lane (§17.191 (2)) on its own runner: the nightly job above has no time to spare.
    # Trend evidence only: no WASM number is official before a quiet-window bless (§17.153).
    if: github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
          echo "$GITHUB_WORKSPACE/bench" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          # Older caches may embed an empty runtime built without the WASM target.
          cache-workspace-crates: true
          key: wasm32-unknown-unknown
      # Official release archive; the SHA-256 also matches GitHub's asset digest.
      - name: Install pinned Wasmtime
        env:
          WASMTIME_VERSION: ${{ steps.pins.outputs.wasmtime }}
        run: |
          test "$RUNNER_OS-$RUNNER_ARCH" = macOS-ARM64
          archive="wasmtime-v${WASMTIME_VERSION}-aarch64-macos"
          curl --fail --location --silent --show-error \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${archive}.tar.xz" \
            --output "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "d7708ba1cc2da171db2c8273d8602f3e0684935dc7cab40148cdcca1da83c0f8  $RUNNER_TEMP/wasmtime.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/$archive/wasmtime" --version | cut -d' ' -f2)" = "$WASMTIME_VERSION"
      - name: WASM lane (Node and Wasmtime)
        run: |
          mkdir -p bench-results
          bench run --suite wasm --lane matched --sizes all --stable --exclude 'bg_*' --exclude 'awfy_*' \
            --json bench-results/nightly-wasm.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-nightly-wasm-macos
          path: bench-results/
          if-no-files-found: warn

  suites:
    # The community suites (bench/README.md, "Community suites"): Benchmarks Game (`bg_*`) and
    # Are We Fast Yet (`awfy_*`) programs on every backend, one runner per group and backend so each
    # fits its timeout. Trend evidence only: no baseline is blessed from a CI runner.
    if: github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'suites')
    name: Suites (${{ matrix.group }}, ${{ matrix.suite }}${{ matrix.engine && format(' {0}', matrix.engine) || '' }})
    strategy:
      fail-fast: false
      matrix:
        group: ["bg", "awfy"]
        suite: [js, wasm, native]
        engine: [""]
        include:
          - { group: bg, suite: js, engine: node }
          - { group: bg, suite: js, engine: bun }
          - { group: awfy, suite: js, engine: node }
          - { group: awfy, suite: js, engine: bun }
        exclude:
          - suite: js
            engine: ""
    runs-on: macos-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
          echo "$GITHUB_WORKSPACE/bench" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.engine == 'bun'
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Install pinned Rust toolchain
        working-directory: compiler
        env:
          BENCH_SUITE: ${{ matrix.suite }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$BENCH_SUITE" = wasm ]; then rustup target add wasm32-unknown-unknown; fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          cache-workspace-crates: ${{ matrix.suite == 'wasm' }}
          key: suites-${{ matrix.suite }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.suite == 'native'
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        if: matrix.suite == 'native'
        with:
          ocaml-compiler: ${{ steps.pins.outputs.ocaml }}
      - name: Expose OCaml native compiler
        if: matrix.suite == 'native'
        run: |
          eval "$(opam env)"
          opam var bin >> "$GITHUB_PATH"
          test "$(ocamlopt -version)" = "${{ steps.pins.outputs.ocaml }}"
      - name: Install pinned Koka
        if: matrix.suite == 'native'
        env:
          KOKA_VERSION: ${{ steps.pins.outputs.koka }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/koka-lang/koka/releases/download/v${KOKA_VERSION}/install.sh" \
            --output "$RUNNER_TEMP/install-koka.sh"
          sh "$RUNNER_TEMP/install-koka.sh" --minimal --force --prefix="$RUNNER_TEMP/koka"
          echo "$RUNNER_TEMP/koka/bin" >> "$GITHUB_PATH"
      # Official release archive; the SHA-256 also matches GitHub's asset digest.
      - name: Install pinned Wasmtime
        if: matrix.suite == 'wasm'
        env:
          WASMTIME_VERSION: ${{ steps.pins.outputs.wasmtime }}
        run: |
          test "$RUNNER_OS-$RUNNER_ARCH" = macOS-ARM64
          archive="wasmtime-v${WASMTIME_VERSION}-aarch64-macos"
          curl --fail --location --silent --show-error \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${archive}.tar.xz" \
            --output "$RUNNER_TEMP/wasmtime.tar.xz"
          echo "d7708ba1cc2da171db2c8273d8602f3e0684935dc7cab40148cdcca1da83c0f8  $RUNNER_TEMP/wasmtime.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/$archive/wasmtime" --version | cut -d' ' -f2)" = "$WASMTIME_VERSION"
      - name: Time the group on this backend
        env:
          BENCH_GROUP: ${{ matrix.group }}
          BENCH_SUITE: ${{ matrix.suite }}
          BENCH_ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p bench-results
          if [ "$BENCH_SUITE" = native ]; then cc --version; fi
          name="suites-${BENCH_GROUP}-${BENCH_SUITE}${BENCH_ENGINE:+-$BENCH_ENGINE}"
          bench run --suite "$BENCH_SUITE" ${BENCH_ENGINE:+--engine "$BENCH_ENGINE"} --filter "${BENCH_GROUP}_*" \
            --lane matched --sizes all --stable --json "bench-results/${name}.json" | tee "bench-results/${name}.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-suites-${{ matrix.group }}-${{ matrix.suite }}${{ matrix.engine && format('-{0}', matrix.engine) || '' }}
          path: bench-results/
          if-no-files-found: warn

  web:
    # TechEmpower-style plaintext and JSON tests of `Serve` (bench/web/README.md): Sakura on Node, Bun
    # and native beside Bun, Node, Go net/http and Rust hyper, all on 127.0.0.1, under the pinned oha.
    # Linux: macOS's default listen backlog (somaxconn 128) drops connections at 1,024.
    if: github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'suites')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Read reference pins
        id: pins
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, version in pins.items():
                  print(f"{name}={version}", file=output)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          key: web
      - name: Cache pinned oha
        id: oha
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.oha
          key: oha-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.oha }}
      - name: Install pinned oha
        if: steps.oha.outputs.cache-hit != 'true'
        env:
          OHA_VERSION: ${{ steps.pins.outputs.oha }}
        run: cargo install oha --version "=$OHA_VERSION" --locked --root ~/.oha
      - name: Plaintext and JSON under load
        run: |
          mkdir -p bench-results
          cc --version
          OHA="$HOME/.oha/bin/oha" python3 bench/web/web.py --build-cli --json bench-results/web.json \
            | tee bench-results/web.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-web-linux
          path: bench-results/
          if-no-files-found: warn

  noise:
    if: github.event.schedule == '43 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'noise')
    name: Noise (${{ matrix.os }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: node
          - os: macos-latest
            engine: node
          - os: macos-latest
            engine: bun
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Validate repeat count and read pins
        id: pins
        env:
          NOISE_REPEATS: ${{ inputs.repeats || 5 }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          try:
              repeats = int(os.environ["NOISE_REPEATS"])
          except ValueError:
              raise SystemExit("repeats must be an integer from 2 to 10")
          if not 2 <= repeats <= 10:
              raise SystemExit("repeats must be an integer from 2 to 10")
          with open("bench/toolchains.toml", "rb") as source:
              pins = tomllib.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name in ("node", "bun"):
                  print(f"{name}={pins[name]}", file=output)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.engine == 'bun'
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
      - name: Repeat quick matched JS subset with load snapshots
        env:
          NOISE_REPEATS: ${{ inputs.repeats || 5 }}
          BENCH_ENGINE: ${{ matrix.engine }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          output = pathlib.Path("bench-results")
          output.mkdir(exist_ok=True)
          for index in range(1, int(os.environ["NOISE_REPEATS"]) + 1):
              name = f"noise-{index}"
              command = [sys.executable, "research/10-evidence/record_load.py",
                         "--log", str(output / f"{name}-load.jsonl"), "--",
                         "bench/bench", "run", "--suite", "js",
                         "--engine", os.environ["BENCH_ENGINE"], "--lane", "matched",
                         "--sizes", "quick", "--filter", "[fp]*",
                         "--seed", str(20261017 + index),
                         "--json", str(output / f"{name}.json")]
              with (output / f"{name}.log").open("w") as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              print(f"{name}: exit {result.returncode}", flush=True)
              if result.returncode:
                  print((output / f"{name}.log").read_text()[-5000:])
                  raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-noise-${{ matrix.os }}-${{ matrix.engine }}
          path: bench-results/
          if-no-files-found: warn
