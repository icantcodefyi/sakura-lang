name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Detect compiler workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-cargo: ${{ steps.detect.outputs.has-cargo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # hashFiles needs a checked-out runner workspace and is unavailable in jobs.if.
      - id: detect
        name: Check root manifest
        env:
          HAS_CARGO: ${{ hashFiles('Cargo.toml') != '' }}
        run: echo "has-cargo=$HAS_CARGO" >> "$GITHUB_OUTPUT"

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: website/package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  rust:
    name: Rust
    needs: workspace
    if: needs.workspace.outputs.has-cargo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust tools
        shell: bash
        run: |
          if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
            rustup show active-toolchain
            rustup component add rustfmt clippy
          else
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  ci-required:
    name: ci-required
    if: always()
    needs: [workspace, website, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all applicable jobs
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          HAS_CARGO: ${{ needs.workspace.outputs.has-cargo }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$WEBSITE_RESULT" = success
          if [ "$HAS_CARGO" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$HAS_CARGO" = false
            test "$RUST_RESULT" = skipped
          fi
