# Diff main from its last green CI run so cancelled changes stay covered.
# Unknown paths, missing history, nightly and default manual runs check everything.
# Superseded PR/main runs cancel. Each nightly has an isolated, non-cancelling group.
# ci-required keeps its branch-protection name and accepts only success/intentional skips.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional comparison commit for a focused manual run; omit for all checks
        type: string
        required: false
  schedule:
    - cron: "37 3 * * *" # Nightly: every check.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'schedule' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.paths.outputs.base }}
      compiler: ${{ steps.paths.outputs.compiler }}
      website: ${{ steps.paths.outputs.website }}
      docs: ${{ steps.paths.outputs.docs }}
      workflows: ${{ steps.paths.outputs.workflows }}
      fuzz: ${{ steps.paths.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest discover -s tools/ci -v
      - name: Detect changed areas
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/ci/changes.py

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: website/package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Check documentation links and rendered routes
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/docs-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          ready=false
          for _attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/docs >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/docs-server.log"; exit 1; fi
          python3 scripts/check-doc-links.py http://127.0.0.1:3000

  rust:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: Rust (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "ubuntu-latest, 1/2"
            partition: --partition hash:1/2
            checks: true
          - os: ubuntu-latest
            label: "ubuntu-latest, 2/2"
            partition: --partition hash:2/2
            checks: false
          - os: ubuntu-24.04-arm
            label: "ubuntu-24.04-arm, 1/2"
            partition: --partition hash:1/2
            checks: true
          - os: ubuntu-24.04-arm
            label: "ubuntu-24.04-arm, 2/2"
            partition: --partition hash:2/2
            checks: false
          - os: windows-2025
            label: "windows-2025, 1/2"
            partition: --partition hash:1/2
            checks: true
          - os: windows-2025
            label: "windows-2025, 2/2"
            partition: --partition hash:2/2
            checks: false
          - os: macos-15-intel
            label: "macos-15-intel, 1/2"
            partition: --partition hash:1/2
            checks: true
          - os: macos-15-intel
            label: "macos-15-intel, 2/2"
            partition: --partition hash:2/2
            checks: false
          - os: macos-latest
            label: "macos-latest, 1/2"
            partition: --partition hash:1/2
            checks: true
          - os: macos-latest
            label: "macos-latest, 2/2"
            partition: --partition hash:2/2
            checks: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      Z3_VERSION: "5.3.1"
      CVC5_VERSION: "1.4.2"
      # The Intel image builds and runs about 2.5x slower than the others; a `sakura` run under
      # test gets 90 s there instead of 30 s (`tests/common/mod.rs` `time_limit`).
      SAKURA_TEST_TIME_SCALE: ${{ matrix.os == 'macos-15-intel' && '3' || '1' }}
    defaults:
      run:
        shell: bash
        working-directory: compiler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          # Older caches may embed an empty runtime built without the WASM target.
          cache-workspace-crates: true
          shared-key: compiler
          key: wasm32-unknown-unknown
          cache-bin: false
          save-if: ${{ matrix.checks }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Official release archives; SHA-256 values also match GitHub's asset digests.
      - name: Select pinned solver archives
        id: solvers
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              z3_platform=x64-glibc-2.39
              z3_sha256=acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40
              cvc5_platform=Linux-x86_64
              cvc5_sha256=7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8
              ;;
            Linux-ARM64)
              z3_platform=arm64-glibc-2.38
              z3_sha256=73195cee08f4a1a53a605b65845268e0ac999666cb8f4e604d2260e0c9c60b5a
              cvc5_platform=Linux-arm64
              cvc5_sha256=765ebee59d9e5efccb60a445fa66fbddfb07a8de9fe7a5b6d128e5c2aafec974
              ;;
            Windows-X64)
              z3_platform=x64-win
              z3_sha256=014e2705e53609bcf46718d7c29426e7d0b98512ed00b8f794e3304869a5fd8b
              cvc5_platform=Win64-x86_64
              cvc5_sha256=9055de9b724724890ba5a19cfdc98f68a8c0653284afa843096dec432a0f88c3
              ;;
            macOS-X64)
              z3_platform=x64-osx-13.3
              z3_sha256=221a03688d6b08814a90c78b42d16d38aa6355dacd0a5253665d42c4d4361230
              cvc5_platform=macOS-x86_64
              cvc5_sha256=f2bbbfe089c77c4a676dd05f262eee86b9718c32374c424138c416024ff42477
              ;;
            macOS-ARM64)
              z3_platform=arm64-osx-13.3
              z3_sha256=0de02438052952153aab5d1361be4d61b6d226337440356c054d403c959da86b
              cvc5_platform=macOS-arm64
              cvc5_sha256=24397f7d022e755876ca836193d4c5f9c1d4326f0f6c01f7d7fc1ddd6bc5096c
              ;;
            *) echo "Unsupported solver platform: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          {
            echo "z3_archive=z3-${Z3_VERSION}-${z3_platform}"
            echo "z3_sha256=$z3_sha256"
            echo "cvc5_archive=cvc5-${cvc5_platform}-static"
            echo "cvc5_sha256=$cvc5_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Z3
        id: cache-z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/solvers/z3
          key: z3-${{ env.Z3_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cache cvc5
        id: cache-cvc5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/solvers/cvc5
          key: cvc5-${{ env.CVC5_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Z3
        if: steps.cache-z3.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.solvers.outputs.z3_archive }}
          SHA256: ${{ steps.solvers.outputs.z3_sha256 }}
        run: |
          archive="$RUNNER_TEMP/$ARCHIVE.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${ARCHIVE}.zip" \
            --output "$archive"
          # Some macOS images ship a BSD sha256sum that does not read a GNU checklist from stdin.
          if [ "$RUNNER_OS" != macOS ]; then
            echo "$SHA256  $archive" | sha256sum -c
          else
            echo "$SHA256  $archive" | shasum -a 256 --check
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP/z3-unpack"
          mkdir -p "$RUNNER_TEMP/solvers"
          mv "$RUNNER_TEMP/z3-unpack/$ARCHIVE" "$RUNNER_TEMP/solvers/z3"
      - name: Install pinned cvc5
        if: steps.cache-cvc5.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.solvers.outputs.cvc5_archive }}
          SHA256: ${{ steps.solvers.outputs.cvc5_sha256 }}
        run: |
          archive="$RUNNER_TEMP/$ARCHIVE.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${ARCHIVE}.zip" \
            --output "$archive"
          # Some macOS images ship a BSD sha256sum that does not read a GNU checklist from stdin.
          if [ "$RUNNER_OS" != macOS ]; then
            echo "$SHA256  $archive" | sha256sum -c
          else
            echo "$SHA256  $archive" | shasum -a 256 --check
          fi
          unzip -q "$archive" -d "$RUNNER_TEMP/cvc5-unpack"
          mkdir -p "$RUNNER_TEMP/solvers"
          mv "$RUNNER_TEMP/cvc5-unpack/$ARCHIVE" "$RUNNER_TEMP/solvers/cvc5"
      - name: Put solvers on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/solvers/z3/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/solvers/cvc5/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/solvers/z3/bin/z3" --version
          "$RUNNER_TEMP/solvers/cvc5/bin/cvc5" --version
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: cargo-nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Check formatting
        if: matrix.checks
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        # The required Parity matrix runs this identical target on both backends/OSes.
        run: cargo nextest run --workspace --locked ${{ matrix.partition }} ${{ runner.os == 'Windows' && '--no-fail-fast' || '' }} -E 'not (package(=sakura_cli) & binary(=parity))'
      - name: Doctests
        if: matrix.checks
        run: cargo test --workspace --doc --locked
      - name: Agent docs are fresh (design §17.142)
        if: matrix.checks
        run: cargo run -p agent_docs --locked -- --check
      - name: Windows installer fixture tests
        if: runner.os == 'Windows' && matrix.checks
        shell: pwsh
        run: ../tools/install/test.ps1 -Binary target/debug/sakura.exe
      - name: Windows PowerShell 5.1 installer fixture tests
        if: runner.os == 'Windows' && matrix.checks
        shell: powershell
        run: ../tools/install/test.ps1 -Binary target/debug/sakura.exe

  msrv:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: compiler
    env:
      Z3_VERSION: "5.3.1"
      CVC5_VERSION: "1.4.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and install declared MSRV
        run: |
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal --target wasm32-unknown-unknown
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          shared-key: msrv-${{ env.MSRV }}
          key: wasm32-unknown-unknown
          cache-workspace-crates: true
          cache-bin: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Official release archives; SHA-256 values also match GitHub's asset digests.
      - name: Select pinned solver archives
        id: solvers
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              z3_platform=x64-glibc-2.39
              z3_sha256=acca9625e8cc8edeb9647b653a1bd696544ddeb5d1c2970a4576734a0c175b40
              cvc5_platform=Linux-x86_64
              cvc5_sha256=7eb18f8c814c36a46c5a7d003983e9cfbc4b0a9828d6dd596239291bd4cc61d8
              ;;
            *) echo "Unsupported solver platform: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          {
            echo "z3_archive=z3-${Z3_VERSION}-${z3_platform}"
            echo "z3_sha256=$z3_sha256"
            echo "cvc5_archive=cvc5-${cvc5_platform}-static"
            echo "cvc5_sha256=$cvc5_sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Z3
        id: cache-z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/solvers/z3
          key: z3-${{ env.Z3_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cache cvc5
        id: cache-cvc5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/solvers/cvc5
          key: cvc5-${{ env.CVC5_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Z3
        if: steps.cache-z3.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.solvers.outputs.z3_archive }}
          SHA256: ${{ steps.solvers.outputs.z3_sha256 }}
        run: |
          archive="$RUNNER_TEMP/$ARCHIVE.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${ARCHIVE}.zip" \
            --output "$archive"
          echo "$SHA256  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/z3-unpack"
          mkdir -p "$RUNNER_TEMP/solvers"
          mv "$RUNNER_TEMP/z3-unpack/$ARCHIVE" "$RUNNER_TEMP/solvers/z3"
      - name: Install pinned cvc5
        if: steps.cache-cvc5.outputs.cache-hit != 'true'
        shell: bash
        env:
          ARCHIVE: ${{ steps.solvers.outputs.cvc5_archive }}
          SHA256: ${{ steps.solvers.outputs.cvc5_sha256 }}
        run: |
          archive="$RUNNER_TEMP/$ARCHIVE.zip"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/${ARCHIVE}.zip" \
            --output "$archive"
          echo "$SHA256  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/cvc5-unpack"
          mkdir -p "$RUNNER_TEMP/solvers"
          mv "$RUNNER_TEMP/cvc5-unpack/$ARCHIVE" "$RUNNER_TEMP/solvers/cvc5"
      - name: Put solvers on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/solvers/z3/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/solvers/cvc5/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/solvers/z3/bin/z3" --version
          "$RUNNER_TEMP/solvers/cvc5/bin/cvc5" --version
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: cargo-nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Check workspace on MSRV (RFC 0001)
        run: cargo "+$MSRV" check --workspace --all-targets --locked
      - name: Test workspace on MSRV
        run: cargo "+$MSRV" nextest run --workspace --locked -E 'not (package(=sakura_cli) & binary(=parity))'

  native:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Platform A, then B (ARM Linux) and C (Windows x64, Intel macOS), plan m5-native.md §5.
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # ubuntu-latest needs about 30 minutes since N4a runs the corpus both ways (cb0056fb),
    # Windows longer; the Intel macOS image 30 to 50.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 75 || 45 }}
    defaults:
      run:
        shell: bash
        working-directory: compiler
    env:
      # Miri, ASan and Memcheck with their detection controls: native-sanitizers.yml (§17.173).
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SAKURA_TEST_TIME_SCALE: ${{ matrix.os == 'macos-15-intel' && '3' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        # wasm32: native parity compares the gauge set and the exact-i64 lane with WASM.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          cache-workspace-crates: true
          shared-key: native
      - name: Verify platform A, B or C host
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64|macOS-ARM64|Linux-ARM64|Windows-X64|macOS-X64) ;;
            *) echo "Unsupported native host: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
      - name: Build opt-in native toolchain
        run: cargo build --features native --locked
      - name: Clippy native runtime, host, backend, driver, CLI and the deep-IR case
        run: cargo clippy -p sakura_rt -p sakura_codegen_native -p sakura_host_native -p sakura_native_driver -p sakura_cli -p sakura_eval --all-targets --features native --locked -- -D warnings
      - name: Install gdb and perf (debugger and profiler smoke, N2d)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb linux-tools-common "linux-tools-$(uname -r)"
          gdb --version | head -n 1
          perf --version
      - name: Native runtime, host, compiled corpus, staticlib and debugger tests
        run: cargo test -p sakura_rt -p sakura_codegen_native -p sakura_host_native -p sakura_native_driver --features native --locked --no-fail-fast -- --nocapture
      - name: A 32,768-row function compiles natively in pieces (N2g)
        run: cargo test -p sakura_eval --features native --locked --test deep_ir native_ -- --nocapture
      - name: Profiler symbolises compiled Sakura frames (perf on Linux, sample on macOS)
        # Windows profilers read CodeView, which the backend does not emit (design §17.175 (7)).
        if: runner.os != 'Windows'
        env:
          SAKURA_NATIVE_LIB_DIR: ${{ github.workspace }}/compiler/target/tmp/native-driver/debug
        run: |
          dir="$RUNNER_TEMP/profile"
          mkdir -p "$dir"
          printf '%s\n' \
            'fn fib(n: Int) -> Int { if n < 2 { n } else { fib(n - 1) + fib(n - 2) } }' \
            'pub fn main() -> Unit ! {Console} { Console.print("{fib(33)}") }' > "$dir/fib.sak"
          target/debug/sakura build --target native --out-dir "$dir/out" "$dir/fib.sak"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo perf record -F 999 -g -o "$dir/perf.data" "$dir/out/main"
            sudo perf report --stdio -i "$dir/perf.data" | tee "$dir/report.txt" > /dev/null
          else
            "$dir/out/main" & pid=$!
            sleep 0.5
            sample "$pid" 1 -file "$dir/report.txt"
            wait "$pid"
          fi
          # The compiled function's symbol is `sakura$<index>$main::fib::fib`.
          grep -m 1 -F 'main::fib::fib' "$dir/report.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Native parity with JS (run-mode fixtures and examples) and the checked build
        run: cargo test -p sakura_cli --features native --locked --test parity native_ -- --nocapture

  parity:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: Parity (${{ matrix.backend }}, ${{ matrix.os }})
    # Share Rust's build cache without waiting for the full workspace test suites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-2025]
        backend: [js, wasm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 30 || 15 }}
    defaults:
      run:
        shell: bash
        working-directory: compiler
    env:
      SAKURA_REQUIRE_WASM: "1"
      SAKURA_PARITY_BACKEND: ${{ matrix.backend }}
      SAKURA_TEST_TIME_SCALE: ${{ matrix.os == 'macos-15-intel' && '3' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          cache-workspace-crates: true
          shared-key: compiler
          key: wasm32-unknown-unknown
          cache-bin: false
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Backend parity and comparator regression
        run: cargo test -p sakura_cli --test parity --locked -- --nocapture ${{ matrix.os == 'macos-15-intel' && '--test-threads=1' || '' }}
      - name: Print host-import coverage
        if: always()
        run: cat target/tmp/parity/imports.txt
      - name: Upload parity traces and host-import coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-${{ matrix.backend }}-${{ matrix.os }}
          path: compiler/target/tmp/parity/
          if-no-files-found: error

  vscode:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          key: vscode
      # The integration tests drive a real `sakura lsp`.
      - name: Build sakura
        working-directory: compiler
        run: cargo build -p sakura_cli --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: editors/vscode/package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests and grammar drift
        run: bun run test
      - name: Integration tests in VS Code
        env:
          SAKURA_BIN: ${{ github.workspace }}/compiler/target/debug/sakura
        run: xvfb-run -a bun run test:vscode
      # A local package only; publishing is the owner's (docs/release.md).
      - name: Package
        run: bun run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sakura-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  tree-sitter:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.website == 'true'
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/tree-sitter-sakura
    env:
      # The `tree-sitter-cli` version in editors/tree-sitter-sakura/package.json.
      TREE_SITTER_VERSION: "0.27.1"
      TREE_SITTER_SHA256: d01042f94ba3d6827ddc9788e235f75d8366431be42bdf90ade534d960c98b7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `tree-sitter generate` evaluates grammar.js with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install tree-sitter CLI
        run: |
          grep -q "\"tree-sitter-cli\": \"$TREE_SITTER_VERSION\"" package.json
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tree-sitter.gz" \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v$TREE_SITTER_VERSION/tree-sitter-linux-x64.gz"
          echo "$TREE_SITTER_SHA256  $RUNNER_TEMP/tree-sitter.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          gunzip -c "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/bin/tree-sitter"
          chmod +x "$RUNNER_TEMP/bin/tree-sitter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # 0.27 has no `generate --check`: regenerate and require no change.
      - name: Generated sources are current
        run: |
          tree-sitter generate
          git diff --exit-code -- src
          test -z "$(git status --porcelain -- src)"
      - name: Corpus and highlight tests
        run: tree-sitter test
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: editors/tree-sitter-sakura
          key: tree-sitter
      # Not `--locked`: `sakura_syntax`'s dependency requirements come from the compiler
      # workspace's Cargo.toml, so a compiler dependency bump would make this lockfile stale.
      - name: Every .sak file against the compiler's parser
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' ../../compiler/rust-toolchain.toml)
          cargo "+$toolchain" test

  contracts:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.workflows == 'true'
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check fixture-indexed specification and generated table
        run: python3 -m unittest discover -s compiler/tools/agent_docs -p 'test_spec_docs.py' -v
      - name: Test diagnostic history checker
        run: python3 -m unittest discover -s compiler/diagnostics -v
      - name: Test JSON contract checker
        run: python3 -I -m unittest discover -s compiler/contracts
      - name: Preserve diagnostic and JSON contracts (RFC 0001, design §17.232)
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          test -n "$BASE_SHA"
          python3 compiler/diagnostics/check_history.py --base "$BASE_SHA"
          python3 compiler/contracts/check_json.py --base "$BASE_SHA"

  release-tooling:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Release tooling tests
        run: python3 -I -m unittest discover -s tools/release -p 'test_*.py'
      - name: Check candidate deprecations and MSRV
        run: python3 -I tools/release/release.py prepare

  doc-checks:
    name: Documentation examples
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.compiler == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAKURA_BIN: ${{ github.workspace }}/compiler/target/debug/sakura
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler
          cache-workspace-crates: true
          shared-key: compiler
          key: wasm32-unknown-unknown
          cache-bin: false
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build documentation compiler
        working-directory: compiler
        run: cargo build -p sakura_cli --locked
      - name: Agent docs are fresh (design §17.142)
        working-directory: compiler
        run: cargo run -p agent_docs --locked -- --check
      - name: Test the milestone guard (design §17.256 (5))
        run: python3 -m unittest discover -s website/scripts -p 'test_check_doc_sweep.py' -v
      - name: Check authored documentation examples
        run: python3 website/scripts/check-doc-sweep.py

  # The website's /play compiles in the browser with compiler/crates/sakura_playground built for
  # wasm32 and committed (Vercel has no Rust). Building it here keeps the crate building for
  # wasm32 and its ABI answering; a committed artifact older than the tree is a notice, not a
  # failure, since compiler changes do not have to republish it.
  playground:
    needs: changes
    if: needs.changes.outputs.compiler == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.workflows == 'true'
    name: Playground wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Check the committed playground wasm
        run: node website/scripts/check-playground.mjs
      - name: Build the playground wasm
        run: website/scripts/playground-wasm.sh
      - name: Check the fresh build
        run: |
          node website/scripts/check-playground.mjs
          if ! git diff --quiet -- website/public/play; then
            echo "::notice::website/public/play/sakura_playground.wasm differs from a build of this tree; run website/scripts/playground-wasm.sh to republish it"
          fi

  # Design §17.285 (2)(a): a stale compiler/fuzz/Cargo.lock fails here, not at the next nightly.
  # A plain stable build of the fuzz crate; fuzz.yml does the fuzzing.
  fuzz-build:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true' || needs.changes.outputs.workflows == 'true'
    name: Fuzz crate builds with its lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: compiler
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # With `native`, so `exec_native` (plan M5 row S) builds too.
      - name: Build the fuzz crate with --locked
        run: cargo build --locked --manifest-path fuzz/Cargo.toml --features native

  ci-required:
    name: ci-required
    if: always()
    # The rust result requires every matrix child, including both partitions on each OS.
    needs: [changes, website, rust, msrv, native, parity, vscode, tree-sitter, contracts, release-tooling, doc-checks, fuzz-build, playground]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$CHANGES_RESULT" = success
          for result in $JOB_RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required job ended with $result" >&2; exit 1 ;;
            esac
          done
