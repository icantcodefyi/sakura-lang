# Release (design §17.147, research/13, docs/release.md).
#
# - Ordinary workflow_dispatch is a secret-free DRY RUN: it builds and smoke-tests every target
#   in packaging/targets.json and uploads the archives, SHA256SUMS, release.json, the skill ZIP,
#   install.sh, the Homebrew formula and the npm tarballs as workflow artifacts. It creates no
#   release, tag, attestation, tap commit or package: the publish jobs cannot run on dispatch.
# - Pushing a tag v<version> (the owner's act) builds the same way, then each channel waits in
#   its protected environment (release-github, release-homebrew, release-npm) for the owner.
#   The tag must equal the workspace version, and the repository variable
#   RELEASE_ENVIRONMENTS_PROTECTED must be "true" (set only after the environments have
#   required reviewers: GitHub creates a missing environment unprotected).
# - workflow_dispatch with sign_test=true runs only the protected signing job on a fresh
#   Darwin build. It notarizes with Apple but never runs any publication job.
# - crates.io is deferred for the alpha (design §17.157; research/13 §2).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign_test:
        description: Sign and notarize a fresh Darwin build on main; publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.sign_test && 'sign-test' || 'artifacts' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.event_name != 'workflow_dispatch' || !inputs.sign_test
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      publish: ${{ steps.plan.outputs.publish }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      formula: ${{ steps.plan.outputs.formula }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Resolve version, commit and mode
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PROTECTED: ${{ vars.RELEASE_ENVIRONMENTS_PROTECTED }}
        run: |
          version=$(python3 -I tools/release/release.py version)
          dist_tag=$(python3 -I tools/release/release.py dist-tag)
          formula=$(python3 -I tools/release/release.py formula)
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          publish=false
          if [ "$EVENT" = push ]; then
            if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
              echo "::error::tag $GITHUB_REF does not match the workspace version $version"
              exit 1
            fi
            if [ "$PROTECTED" != true ]; then
              echo "::error::set the repository variable RELEASE_ENVIRONMENTS_PROTECTED=true once release-github, release-homebrew and release-npm require the owner's review"
              exit 1
            fi
            publish=true
          fi
          matrix=$(python3 -I -c 'import json; print(json.dumps(json.load(open("packaging/targets.json"))))')
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "publish=$publish"
            echo "dist_tag=$dist_tag"
            echo "formula=$formula"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Sakura Lang $version at $commit; publish: $publish; npm dist-tag: $dist_tag; formula: $formula" >> "$GITHUB_STEP_SUMMARY"
      - name: Release tooling tests
        run: |
          shellcheck tools/release/sign-macos.sh tools/release/verify-macos.sh
          python3 -I -m unittest discover -s tools/release -p 'test_*.py'
      - name: Check candidate deprecations and MSRV
        run: python3 -I tools/release/release.py prepare
      - name: Installer tests
        run: |
          shellcheck tools/install/install.sh tools/install/test.sh
          sh tools/install/test.sh

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      TARGET: ${{ matrix.target }}
      EXE_SUFFIX: ${{ matrix.os == 'win32' && '.exe' || '' }}
      ARCHIVE_SUFFIX: ${{ matrix.os == 'win32' && '.zip' || '.tar.gz' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET" wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # No build cache: release binaries come from a clean, locked build of this commit.
      - name: Build sakura
        working-directory: compiler
        env:
          SAKURA_GIT_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export RUSTFLAGS='-C target-feature=+crt-static'; fi
          cargo build --locked --release -p sakura_cli --bin sakura --target "$TARGET"
      - name: Explain unsigned dry-run artifacts
        if: runner.os == 'macOS' && needs.plan.outputs.publish != 'true'
        run: |
          echo 'Dry run: macOS signing and notarization skipped; no Apple secrets or environment approval needed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive
        run: python3 -I tools/release/release.py archive --target "$TARGET" --binary "compiler/target/$TARGET/release/sakura$EXE_SUFFIX" --out dist
      - name: Smoke test the extracted archive
        run: python3 -I tools/release/release.py smoke --archive "dist/sakuralang-$VERSION-$TARGET$ARCHIVE_SUFFIX" --commit "$COMMIT"
      - name: Record the host floor
        run: |
          bin="compiler/target/$TARGET/release/sakura$EXE_SUFFIX"
          case "$RUNNER_OS" in
            Linux) floor=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1) ;;
            Windows) floor="Windows 10 x64+, statically linked MSVC CRT" ;;
            macOS) floor="macOS $(otool -l "$bin" | awk '/minos/ { print $2; exit }')" ;;
          esac
          echo "$TARGET: built on $ImageOS $ImageVersion, needs $floor" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  sign-darwin:
    name: Sign and notarize Darwin
    needs: [plan, build]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.plan.outputs.publish == 'true' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.sign_test && github.ref == 'refs/heads/main'))
    environment: release-github
    runs-on: macos-14
    timeout-minutes: 60
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve Darwin inventory
        id: context
        run: |
          echo "version=$(python3 -I tools/release/release.py version)" >> "$GITHUB_OUTPUT"
          python3 -I -c 'import json; print("\n".join(t["target"] for t in json.load(open("packaging/targets.json")) if t["os"] == "darwin"))' > "$RUNNER_TEMP/darwin-targets"
          test -s "$RUNNER_TEMP/darwin-targets"
      - name: Install pinned Rust toolchain
        working-directory: compiler
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Fresh Darwin build for signing test
        if: github.event_name == 'workflow_dispatch' && inputs.sign_test
        working-directory: compiler
        env:
          SAKURA_GIT_COMMIT: ${{ github.sha }}
        run: |
          rustup target add wasm32-unknown-unknown
          while IFS= read -r target; do
            rustup target add "$target"
            cargo build --locked --release -p sakura_cli --bin sakura --target "$target"
            python3 -I ../tools/release/release.py archive --target "$target" --binary "target/$target/release/sakura" --out ../unsigned
          done < "$RUNNER_TEMP/darwin-targets"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'push'
        with:
          pattern: archive-*-apple-darwin
          merge-multiple: true
          path: unsigned
      - name: Extract Darwin archives
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          mkdir stage
          while IFS= read -r target; do
            tar -xzf "unsigned/sakuralang-$VERSION-$target.tar.gz" -C stage
          done < "$RUNNER_TEMP/darwin-targets"
      - name: Sign and notarize with the pinned Developer ID
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tools/release/sign-macos.sh stage/sakuralang-*-apple-darwin/sakura
      - name: Remove signing credentials even after cancellation
        if: always()
        run: |
          keychain="$RUNNER_TEMP/sakura-signing/signing.keychain-db"
          status=0
          if [ -f "$keychain" ]; then security delete-keychain "$keychain" >/dev/null 2>&1 || status=1; fi
          rm -rf "$RUNNER_TEMP/sakura-signing"
          exit "$status"
      - name: Enable Intel execution for signed archive smoke
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Archive and smoke the signed binaries
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          while IFS= read -r target; do
            python3 -I tools/release/release.py archive --target "$target" --binary "stage/sakuralang-$VERSION-$target/sakura" --macos-signed --out signed
            python3 -I tools/release/release.py smoke --archive "signed/sakuralang-$VERSION-$target.tar.gz" --commit "$COMMIT"
          done < "$RUNNER_TEMP/darwin-targets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.sign_test && 'sign-test-darwin' || 'signed-darwin' }}
          path: signed/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble
    needs: [plan, build, sign-darwin]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      ((needs.plan.outputs.publish == 'true' && needs.sign-darwin.result == 'success') ||
       (needs.plan.outputs.publish == 'false' && needs.sign-darwin.result == 'skipped'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Remove unsigned Darwin archives before replacement
        if: needs.plan.outputs.publish == 'true'
        run: |
          python3 -I -c 'import json, os; from pathlib import Path; [Path("archives", "sakuralang-" + os.environ["VERSION"] + "-" + t["target"] + ".tar.gz").unlink() for t in json.load(open("packaging/targets.json")) if t["os"] == "darwin"]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          name: signed-darwin
          path: archives
      - name: Assemble the release set
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          signing=()
          if [ "$PUBLISH" = true ]; then signing+=(--macos-signed); fi
          python3 -I tools/release/release.py assemble --commit "$COMMIT" --archives archives --out dist "${signing[@]}"
      - name: Check sums
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Summary
        run: |
          {
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke-install:
    name: Install smoke (${{ matrix.target }})
    needs: [plan, assemble]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.assemble.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      NPM_PACKAGE: ${{ matrix.npm }}
      FORMULA: ${{ needs.plan.outputs.formula }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist
      - name: Check sums, installer and npm offline install
        if: runner.os != 'Windows'
        run: |
          (cd dist && shasum -a 256 --check SHA256SUMS)
          # These local artifacts are not attested until publication. Exercise the
          # installer's explicit no-gh fallback without hiding verification failures.
          installer_tools="$RUNNER_TEMP/installer-tools"
          mkdir "$installer_tools"
          for tool in uname sysctl ls ldd grep mktemp rm cp awk shasum cut tar gzip mkdir chmod mv; do
            if path=$(command -v "$tool"); then ln -s "$path" "$installer_tools/$tool"; fi
          done
          PATH="$installer_tools" /bin/sh dist/install.sh \
            --prefix "$RUNNER_TEMP/install prefix" --base-url "$PWD/dist"
          "$RUNNER_TEMP/install prefix/bin/sakura" --version
          npm install --global --prefix "$RUNNER_TEMP/npm prefix" --offline --ignore-scripts \
            --no-audit --no-fund --cache "$RUNNER_TEMP/empty-npm-cache" \
            "./dist/sakuralang-$VERSION.tgz" "./dist/$NPM_PACKAGE-$VERSION.tgz"
          test "$("$RUNNER_TEMP/npm prefix/bin/sakura" --version)" = "sakura $VERSION ($COMMIT)"

      - name: Smoke the Intel Homebrew formula against the assembled archive
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          # Mirror only the URLs for this local smoke; hashes and production asset stay intact.
          brew tap-new --no-git sakuralang/release-smoke
          FORMULA_PATH="$(brew --repository sakuralang/release-smoke)/Formula/$FORMULA.rb"
          export FORMULA_PATH
          python3 -I - <<'PYTHON'
          import os, re
          from pathlib import Path
          source = Path('dist', os.environ['FORMULA'] + '.rb').read_text()
          source = re.sub(r'https://github.com/icantcodefyi/sakuralang/releases/download/v[^/]+/([^"\n]+)',
                          lambda match: (Path('dist') / match[1]).resolve().as_uri(), source)
          Path(os.environ['FORMULA_PATH']).write_text(source)
          PYTHON
          brew trust --formula "sakuralang/release-smoke/$FORMULA"
          brew install --formula "sakuralang/release-smoke/$FORMULA"
          test "$(sakura --version)" = "sakura $VERSION ($COMMIT)"
          brew test "sakuralang/release-smoke/$FORMULA"

      - name: Windows installer and npm offline install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Line in Get-Content dist/SHA256SUMS) {
            $Hash, $Name = $Line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$Name").Hash.ToLowerInvariant() -ne $Hash) { throw "Checksum mismatch: $Name" }
          }
          ./dist/install.ps1 -Prefix "$env:RUNNER_TEMP/install prefix" -BaseUrl "$pwd/dist"
          & "$env:RUNNER_TEMP/install prefix/bin/sakura.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke failed' }
          npm install --global --prefix "$env:RUNNER_TEMP/npm prefix" --offline --ignore-scripts --no-audit --no-fund --cache "$env:RUNNER_TEMP/empty-npm-cache" "./dist/sakuralang-$env:VERSION.tgz" "./dist/$env:NPM_PACKAGE-$env:VERSION.tgz"
          if ($LASTEXITCODE -ne 0) { throw 'npm offline install failed' }
          $Version = node "$env:RUNNER_TEMP/npm prefix/node_modules/sakuralang/bin/sakura.js" --version
          if ($LASTEXITCODE -ne 0 -or $Version -ne "sakura $env:VERSION ($env:COMMIT)") { throw 'npm wrapper smoke failed' }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os == 'macOS' && needs.plan.outputs.publish == 'true'
        with:
          persist-credentials: false
      - name: Verify signed installer and npm binaries
        if: runner.os == 'macOS' && needs.plan.outputs.publish == 'true'
        run: |
          bash tools/release/verify-macos.sh "$RUNNER_TEMP/install prefix/bin/sakura"
          bash tools/release/verify-macos.sh "$RUNNER_TEMP/npm prefix/lib/node_modules/$NPM_PACKAGE/bin/sakura"

  # Everything below runs only for an owner-pushed tag, each job behind its environment.
  publish-github:
    name: Publish GitHub release
    needs: [plan, assemble, smoke-install]
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-github
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist
      - name: Verify the approved bytes
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Design §17.249: a plain X.Y.Z is marked latest; -alpha.N / -beta.N / -rc.N is a prerelease.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest=true)
          if [ "$DIST_TAG" != latest ]; then flags=(--prerelease --latest=false); fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${flags[@]}" --title "Sakura Lang $VERSION" --notes-file dist/release-notes.md

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [plan, publish-github]
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-homebrew
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      FORMULA: ${{ needs.plan.outputs.formula }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist
      - name: Verify the approved bytes
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      # `sakuralang` for X.Y.Z; a prerelease is its own formula (`sakuralang-beta`), so the
      # tap's `sakuralang` stays on the latest final release, as npm `latest` does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: icantcodefyi/homebrew-sakuralang
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Commit the formula to the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "../dist/$FORMULA.rb" "Formula/$FORMULA.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA.rb"
          git commit -m "$FORMULA $VERSION"
          git push origin HEAD

  publish-npm:
    name: Publish npm packages
    needs: [plan, publish-github]
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist
      - name: Verify the approved bytes
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      # Trusted publishing (OIDC) when configured on npmjs.com; otherwise NPM_TOKEN from the
      # environment. Platform packages first, then the wrapper, under the version's dist-tag:
      # `latest` for a plain X.Y.Z, `alpha`, `beta` or `rc` for a prerelease (design §17.249).
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ./dist/sakuralang-*-"$VERSION".tgz; do
            npm publish "$pkg" --tag "$DIST_TAG" --access public --provenance
          done
          npm publish "./dist/sakuralang-$VERSION.tgz" --tag "$DIST_TAG" --access public --provenance
